name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          # Токен нужен для скачивания SDK и работы со сторонними API внутри экшена
          token: ${{ secrets.GITHUB_TOKEN }}
          target: win
